name: Build and Push Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout from Gitee
        run: |
          git clone --depth=1 https://gitee.com/OpenClaw-CN/openclaw-cn.git /tmp/openclaw-cn
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: /tmp/openclaw-cn
          file: /tmp/openclaw-cn/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/openclaw:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
